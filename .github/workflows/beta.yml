# The private beta: every push to `dev` puts that version of the web app at hellodemo.app/beta/ (unlisted, not
# indexed), so new features can be tried in a browser before they're released. Everything else on the website,
# the public web app (hellodemo.app/app) and the Mac download only change when scripts/release.sh releases dev.
# It also writes the newest build number (APP_SEQ) into the released copies, so every app shows the same build.
# Note: the beta uses the same accounts and songs as the real app.
name: Beta
on:
  push:
    branches: [dev]
    paths: ["www/index.html"]
  workflow_dispatch:
concurrency: { group: beta, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - name: Copy the dev web app to docs/beta
        run: |
          mkdir -p site/docs/beta
          cp site/docs/app/icon-*.png site/docs/app/manifest.json site/docs/beta/ 2>/dev/null || true
          # keep it out of search results, and mark it as the beta
          sed -e '0,/<head>/s##<head><meta name="robots" content="noindex,nofollow">#' \
              -e 's#<title>\*\[demo\]</title>#<title>*[demo] beta</title>#' dev/www/index.html > site/docs/beta/index.html
      # one build number across every app: the released copies on main show the newest build number too
      - name: Carry the build number to the released apps
        run: |
          SEQ=$(grep -o "^var APP_SEQ=[0-9]*;" dev/www/index.html | grep -o "[0-9]*")
          [ -n "$SEQ" ] || exit 0
          for f in docs/app/index.html mac-app/app/index.html web-artifact/songpad.html; do
            [ -f "site/$f" ] && sed -i "s/^var APP_SEQ=[0-9]*;$/var APP_SEQ=$SEQ;/" "site/$f"
          done
      - name: Publish
        working-directory: site
        run: |
          git config user.name "demo beta"; git config user.email "beta@hellodemo.app"
          git add docs/beta docs/app/index.html mac-app/app/index.html web-artifact/songpad.html
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -q -m "Beta: $(cd ../dev && git rev-parse --short HEAD) (build $(grep -o "^var APP_SEQ=[0-9]*;" ../dev/www/index.html | grep -o "[0-9]*"))"
          git push -q origin main
