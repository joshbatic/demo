# Builds the Mac app download on a Mac whenever the Mac app changes on main, and puts it on the latest GitHub release
# as demo-mac-<version>.dmg (e.g. demo-mac-1.1.0.dmg, the version from mac-app/package.json), which is what
# hellodemo.app/mac.html's "Download for Mac" button links to (scripts/release.sh updates that link). Older versioned
# files are removed from the release, and a copy named demo-mac.dmg stays too, so older links keep working.
#
# Signed "ad hoc" until these repository secrets exist (Settings › Secrets and variables › Actions); then it's
# signed with your Developer ID and notarised, so it opens with no warning:
#   MAC_CERT_P12        your "Developer ID Application" certificate exported from Keychain Access as .p12, base64
#   MAC_CERT_PASSWORD   the password you gave that .p12
#   MAC_DEVELOPER_ID    the certificate's name, e.g. Developer ID Application: … (KZL3T52VV3)
#   NOTARY_APPLE_ID, NOTARY_PASSWORD (an app-specific password), NOTARY_TEAM_ID (KZL3T52VV3)
name: Mac download
# Mac machines use GitHub's free minutes ten times faster in a private repo, so this no longer rebuilds on every app
# change (mac-app/app/index.html changes with each one). It rebuilds when the Mac app itself changes, every Monday
# (so the download picks up a week of app changes), and from Actions › Mac download › Run workflow.
on:
  push:
    branches: [main]
    paths: ["mac-app/main.js", "mac-app/preload.js", "mac-app/package.json", "mac-app/build/**", "mac-app/scripts/**", ".github/workflows/mac-download.yml"]
  schedule:
    - cron: "17 20 * * 0"   # Monday 6:47 am Adelaide
  workflow_dispatch:
concurrency: { group: mac-download, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Signing certificate (if set up)
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No certificate yet: building ad hoc."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KP=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          # Apple's Developer ID intermediate certificates, so each signature carries the full chain the notary checks
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && \
              security import "$RUNNER_TEMP/$ca.cer" -k "$KC" -A >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # which signing identities the .p12 brought in (the one used must say "Developer ID Application")
          security find-identity -v -p codesigning "$KC" | sed 's/^ *[0-9]*) [0-9A-F]* /  /' 
      - name: Notarisation login (if set up)
        env:
          AID: ${{ secrets.NOTARY_APPLE_ID }}
          APW: ${{ secrets.NOTARY_PASSWORD }}
          TID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "$AID" ]; then exit 0; fi
          xcrun notarytool store-credentials demo-notary --apple-id "$AID" --password "$APW" --team-id "$TID"
          echo "NOTARY_PROFILE=demo-notary" >> "$GITHUB_ENV"
      - name: Build the download
        env:
          DEVELOPER_ID: ${{ secrets.MAC_DEVELOPER_ID }}
        run: |
          cd mac-app
          bash scripts/build-download.sh
          VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp dist/demo-*-mac.dmg "$RUNNER_TEMP/demo-mac-$VER.dmg"
          cp dist/demo-*-mac.dmg "$RUNNER_TEMP/demo-mac.dmg"
      # The public download lives on joshbatic/demo-releases (a public repo with only release files), so this repo
      # can be private. RELEASES_TOKEN: a fine-grained token with Contents read/write on demo-releases only.
      - name: Publish to the public downloads repo
        env: { GH_TOKEN: "${{ secrets.RELEASES_TOKEN }}" }
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASES_TOKEN yet: skipping demo-releases."; exit 0; fi
          R=joshbatic/demo-releases
          TAG=$(gh api "repos/$R/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -z "$TAG" ]; then TAG=mac; gh release create "$TAG" --repo "$R" --title "*[demo] for Mac" --notes "The latest *[demo] for Mac."; fi
          for old in $(gh release view "$TAG" --repo "$R" --json assets -q '.assets[].name' | grep -E '^demo-mac-[0-9.]+\.dmg$' | grep -v "^demo-mac-$VER.dmg$" || true); do gh release delete-asset "$TAG" "$old" --repo "$R" -y; done
          gh release upload "$TAG" "$RUNNER_TEMP/demo-mac-$VER.dmg" "$RUNNER_TEMP/demo-mac.dmg" --clobber --repo "$R"
          gh release edit "$TAG" --repo "$R" --title "*[demo] for Mac $VER" --notes "*[demo] for Mac $VER. Download demo-mac-$VER.dmg." || true
          echo "Uploaded demo-mac-$VER.dmg to $R $TAG"
      - name: Also replace it on this repo's latest release (while it's public)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -z "$TAG" ]; then exit 0; fi
          for old in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -E '^demo-mac-[0-9.]+\.dmg$' | grep -v "^demo-mac-$VER.dmg$" || true); do gh release delete-asset "$TAG" "$old" --repo "${{ github.repository }}" -y; done
          gh release upload "$TAG" "$RUNNER_TEMP/demo-mac-$VER.dmg" "$RUNNER_TEMP/demo-mac.dmg" --clobber --repo "${{ github.repository }}"
