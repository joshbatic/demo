<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--META-->
<title>*[demo]</title>
<meta property="og:title" content="A song shared from *[demo]">
<meta property="og:image" content="https://hellodemo.app/icon-512.png">
<!--/META-->
<meta name="robots" content="noindex">
<meta property="og:site_name" content="*[demo]">
<link rel="icon" href="https://hellodemo.app/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;font:17px/1.4 -apple-system,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#3B2E5A;background:linear-gradient(155deg,#FFD3BE,#E3CCFF 52%,#BFDDFF)}
.m{text-align:center;padding:32px 24px;max-width:420px}
.m b{display:block;font-size:22px;letter-spacing:-.01em;margin-bottom:6px}
.m p{margin:0;color:rgba(59,46,90,.7)}
.m a{display:inline-block;margin-top:22px;color:#3B2E5A;font-weight:600;text-decoration:none;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.55)}
.dots{display:flex;gap:7px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#3B2E5A;opacity:.3;animation:d 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:.8;transform:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<div class="m" id="m" aria-live="polite"><div class="dots" aria-label="Loading"><i></i><i></i><i></i></div></div>
<script>
/* *[demo] share-link viewer. Generated by scripts/build-share-viewer.py from www/index.html; edit those, not this. */
var SB_URL='@@SB_URL@@',SB_KEY='@@SB_KEY@@',PUB=SB_URL+'/storage/v1/object/public/shares/';
var SKB='@@SKB@@',SKF='@@SKF@@';
var PRE=null;/*PRELOAD*/
@@RENDER@@
(function(){
  function msg(t,s){var m=document.getElementById('m');m.innerHTML='<b></b><p></p><a href="https://hellodemo.app/">What’s *[demo]?</a>';m.firstChild.textContent=t;m.children[1].textContent=s||''}
  var seg=location.pathname.split('/').filter(Boolean).pop()||'',q=location.search.slice(1)||location.hash.slice(1),id=/^[A-Za-z0-9]{10}$/.test(seg)?seg:(q.split('&')[0]||'').replace(/^id=/,'');
  if(!/^[A-Za-z0-9]{10}$/.test(id))return msg('This link isn’t quite right','Check you have the whole link, then try again.');
  var str=function(v,n){return typeof v==='string'?v.slice(0,n||300):typeof v==='number'?String(v):''};
  var col=function(v,d){return typeof v==='string'&&/^hsla?\(\d{1,3},\d{1,3}%,\d{1,3}%(,[\d.]+)?\)$/.test(v)?v:d};
  var url=function(v){return typeof v==='string'&&v.indexOf(PUB)===0&&!/["'<>\s]/.test(v)?v:''};
  function clean(d){var b=d.bg||{},a=d.audio,out={title:str(d.title),artist:str(d.artist),key:str(d.key,12),bpm:/^\d{1,3}$/.test(String(d.bpm))?String(d.bpm):'',
      bg:{top:col(b.top,'hsl(20,80%,86%)'),bot:col(b.bot,'hsl(280,60%,80%)'),glow:col(b.glow,'hsl(210,70%,88%)'),k:typeof b.k==='string'&&/^\d{1,3},\d{1,3}%,\d{1,3}%$/.test(b.k)?b.k:'260,30%,15%'},
      art:url(d.art),audio:null,blocks:[]};
    (Array.isArray(d.blocks)?d.blocks.slice(0,3000):[]).forEach(function(x){if(!x||typeof x!=='object')return;if(x.gap)out.blocks.push({gap:true});else if(x.sec!=null)out.blocks.push({sec:str(x.sec,120)});else if(x.line!=null)out.blocks.push({line:str(x.line,500),t:typeof x.t==='number'&&isFinite(x.t)?x.t:null})});
    if(a&&url(a.src))out.audio={src:url(a.src),name:str(a.name,160),dur:+a.dur||0,peaks:(Array.isArray(a.peaks)?a.peaks.slice(0,2000):[]).map(Number).filter(isFinite)};
    return out}
  function show(d){if(!d||typeof d!=='object')return msg('This song isn’t shared any more','Ask whoever sent it for a new link.');
    /* let the writer know it's being listened to (once a day per link, if they want that: supabase/notify.sql) */
    try{fetch(SB_URL+'/rest/v1/rpc/share_seen',{method:'POST',keepalive:true,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({sid:id})}).catch(function(){})}catch(e){}
    var html=shRender(clean(d),{skB:SKB,skF:SKF});
    /* replace the whole loading page. While the page is still loading, document.open() is ignored and the song
       would be added underneath the loading dots, so wait for the page to finish loading first */
    var swap=function(){document.open();document.write(html);document.close()};
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(swap,0)});else swap()}
  if(PRE&&PRE.id===id)return show(PRE.data);
  fetch(SB_URL+'/rest/v1/rpc/get_share',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({sid:id})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(show)
    .catch(function(){msg('Couldn’t load this song','Check your connection and try again.')});
})();
</script>
</body>
</html>
